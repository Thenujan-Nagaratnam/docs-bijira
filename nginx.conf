server {
    listen       8080;
    listen  [::]:8080;
    server_name  localhost;

    # Redirect all temp paths to /tmp (writable in read-only filesystems)
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # The site is built under /cloud/. The staging router currently strips
    # /cloud before forwarding (/docs-staging/cloud/x -> /x), so each request
    # tries the /cloud/ copy first, then the path as requested (which also
    # covers a router that keeps the prefix). Only files are checked, never
    # directories, so nginx never answers with a directory redirect (its
    # Location would carry this component's path, not the reader's) and an
    # index-less directory never gives 403.
    root   /usr/share/nginx/html;

    # The product root has no page of its own (no cloud/index.md): send it to
    # the introduction, as #617 intended. The target is built from the
    # browser's own address (not this component's path), so it is right
    # whether the router strips /cloud or keeps it, with or without the
    # trailing slash; meta refresh covers browsers without JavaScript.
    # A 200 page, not a 301: an nginx redirect would carry this component's
    # host and path.
    location = / {
        default_type text/html;
        add_header 'Access-Control-Allow-Origin' '*' always;
        return 200 "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><title>Redirecting...</title><meta name=\"robots\" content=\"noindex\"><script>var p=location.pathname;if(p.slice(-1)!==\"/\")p+=\"/\";location.replace(p+\"introduction/what-is-bijira/\"+location.hash)</script><meta http-equiv=\"refresh\" content=\"0; url=introduction/what-is-bijira/\"></head><body>Redirecting...</body></html>\n";
    }
    location = /cloud/ {
        default_type text/html;
        add_header 'Access-Control-Allow-Origin' '*' always;
        return 200 "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><title>Redirecting...</title><meta name=\"robots\" content=\"noindex\"><script>var p=location.pathname;if(p.slice(-1)!==\"/\")p+=\"/\";location.replace(p+\"introduction/what-is-bijira/\"+location.hash)</script><meta http-equiv=\"refresh\" content=\"0; url=introduction/what-is-bijira/\"></head><body>Redirecting...</body></html>\n";
    }
    location = /cloud {
        default_type text/html;
        add_header 'Access-Control-Allow-Origin' '*' always;
        return 200 "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><title>Redirecting...</title><meta name=\"robots\" content=\"noindex\"><script>var p=location.pathname;if(p.slice(-1)!==\"/\")p+=\"/\";location.replace(p+\"introduction/what-is-bijira/\"+location.hash)</script><meta http-equiv=\"refresh\" content=\"0; url=cloud/introduction/what-is-bijira/\"></head><body>Redirecting...</body></html>\n";
    }

    # Page URLs: /introduction/what-is-bijira/
    location ~ /$ {
        try_files /cloud${uri}index.html ${uri}index.html =404;
        # Fetched cross-origin by every other product+version deployment's
        # pages, to render this product's section in their sidebar.
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    # Files (manifest, assets, search index) and page URLs without the slash
    location / {
        try_files /cloud$uri $uri /cloud$uri/index.html $uri/index.html =404;
        add_header 'Access-Control-Allow-Origin' '*' always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
